model {
    components {
        frcUserProgram(NativeExecutableSpec) {
            targetPlatform wpi.platforms.roborio
            if (includeDesktopSupport) {
                targetPlatform wpi.platforms.desktop
            }

            sources.cpp {
                source {
                    srcDir 'src'
                    include '**/*.cpp', '**/*.cc'
                }
                exportedHeaders {
                    srcDir 'src'
                }
            }

            binaries.all {
                configurePlatformDependencies(it)
            }

            // Set deploy task to deploy this component
            deployArtifact.component = it

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            // Enable simulation for this component
            wpi.sim.enable(it)
            // Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
    testSuites {
        frcUserProgramTest(GoogleTestTestSuiteSpec) {
            testing $.components.frcUserProgram

            sources.cpp {
                source {
                    srcDir 'test'
                    include '**/*.cpp'
                }
            }

            binaries.all {
                configurePlatformDependencies(it)
            }

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.deps.googleTest(it)
        }
    }
}

// Custom task to extract Lua modules from vendordeps
import groovy.json.JsonSlurper

task extractLuaModules {
    doLast {
        def vendordepsDir = file('vendordeps')
        def luabotDir = file('build/luabot')

        // Parse all vendordeps JSON files
        vendordepsDir.eachFileMatch(~/.*\.json/) { vendordepFile ->
            def json = new JsonSlurper().parse(vendordepFile)
            
            // Check if this vendordep has luaDependencies
            if (json.luaDependencies) {
                def mavenUrls = json.mavenUrls ?: []
                
                json.luaDependencies.each { dep ->
                    def groupId = dep.groupId
                    def artifactId = dep.artifactId
                    def version = dep.version
                    def classifier = dep.moduleClassifier ?: 'modules'
                    def ffiEnabled = dep.ffiEnabled ?: false

                    def luaDir = ffiEnabled ? new File(luabotDir, 'share/luajit-2.1')
                                            : new File(luabotDir, 'share/lua/5.1')
                    luaDir.mkdirs()

                    // Convert groupId to path (e.g., "org.luabot" -> "org/luabot")
                    def groupPath = groupId.replace('.', '/')
                    
                    // Build artifact path and filename
                    def artifactPath = "${groupPath}/${artifactId}/${version}"
                    def fileName = "${artifactId}-${version}-${classifier}.zip"
                    def fullPath = "${artifactPath}/${fileName}"
                    
                    println "Resolving Lua dependency: ${groupId}:${artifactId}:${version}:${classifier}"
                    
                    // Check if already downloaded in WPILib's local maven repo first
                    def wpilibMaven = new File(System.getProperty('user.home'), "wpilib/2026/maven")
                    def localZip = new File(wpilibMaven, fullPath)
                    
                    def zipToExtract = null
                    
                    if (localZip.exists()) {
                        println "  ✓ Found in local WPILib maven: ${localZip.absolutePath}"
                        zipToExtract = localZip
                    } else {
                        // Not found locally, try downloading from Maven URLs
                        for (mavenUrl in mavenUrls) {
                            try {
                                def url = new URL("${mavenUrl}${fullPath}")
                                def zipFile = new File(luaDir, "${artifactId}-${version}.zip")
                                
                                println "  Downloading from: ${url}"
                                
                                url.withInputStream { input ->
                                    zipFile.withOutputStream { output ->
                                        output << input
                                    }
                                }
                                
                                zipToExtract = zipFile
                                break
                                
                            } catch (Exception e) {
                                println "  ✗ Failed to download from ${mavenUrl}: ${e.message}"
                            }
                        }
                    }
                    
                    if (zipToExtract == null) {
                        throw new GradleException("Failed to find or download Lua dependency: ${groupId}:${artifactId}:${version}:${classifier}")
                    }
                    
                    println "  Extracting to: ${luaDir.absolutePath}"
                    
                    // Extract the zip file
                    ant.unzip(src: zipToExtract.absolutePath, dest: luaDir.absolutePath, overwrite: true)
                    
                    // Delete the downloaded zip file if we downloaded it (not from local maven)
                    if (zipToExtract != localZip && zipToExtract.exists()) {
                        zipToExtract.delete()
                    }
                    
                    println "  ✓ Successfully extracted ${fileName}"
                }
            }
        }
    }
}

// Deploy Lua modules to RoboRIO via SSH
task deployLuaModules {
    dependsOn extractLuaModules
    
    doLast {
        // Setup SSH Ant tasks
        ant.taskdef(
            name: 'scp',
            classname: 'org.apache.tools.ant.taskdefs.optional.ssh.Scp',
            classpath: configurations.sshAntTask.asPath
        )
        ant.taskdef(
            name: 'sshexec',
            classname: 'org.apache.tools.ant.taskdefs.optional.ssh.SSHExec',
            classpath: configurations.sshAntTask.asPath
        )
        
        def team = project.frc.getTeamNumber()
        def host = "roborio-${team}-frc.local"
        def user = "admin"
        def password = "" // Empty for RoboRIO
        def luaPath = "/opt/luabot/share/luajit-2.1"
        
        println "Deploying Lua modules to ${host}:${luaPath}"
        
        // Create temporary directory on RoboRIO
        ant.sshexec(
            host: host,
            username: user,
            password: password,
            trust: true,
            command: "mkdir -p /tmp/lua-modules"
        )
        
        // Copy files to temp directory via SCP
        ant.scp(
            todir: "${user}@${host}:/tmp/lua-modules",
            password: password,
            trust: true
        ) {
            fileset(dir: 'build/lua')
        }
        
        // Create target directory and move files with sudo
        ant.sshexec(
            host: host,
            username: user,
            password: password,
            trust: true,
            command: "sudo mkdir -p ${luaPath} && sudo cp -r /tmp/lua-modules/* ${luaPath}/ && sudo rm -rf /tmp/lua-modules"
        )
        
        println "✓ Successfully deployed Lua modules to ${luaPath}"
    }
}

// Run extractLuaModules before build, simulation, and test tasks
tasks.matching { task ->
    task.name == 'build' || 
    task.name.startsWith('simulate') || 
    task.name.startsWith('test')
}.configureEach {
    dependsOn extractLuaModules
}
