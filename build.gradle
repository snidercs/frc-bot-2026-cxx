plugins {
    id "cpp"
    id "google-test-test-suite"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

// Configuration for SSH deployment
configurations {
    sshAntTask
}

dependencies {
    sshAntTask 'org.apache.ant:ant-jsch:1.10.14'
}

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcCpp(getArtifactTypeClass('FRCNativeArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('robot')
                    directory = '/home/lvuser/robot'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('build/luabot/share/luajit-2.1')
                    directory = '/home/lvuser/luabot/*'
                    deleteOldFiles = true // Change to true to delete files on roboRIO that no
                                          // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcCpp

// Set this to true to enable desktop support.
// NOTE: Linux x86-64 simulation currently fails with fmt assertion in WPILib 2026.2.1
// when system libstdc++6 is version 13.x. This is a WPILib bug in HAL extension loading.
// Workaround for Linux: Set this to false. Windows/macOS should work fine.
def includeDesktopSupport = true

// Set to true to run simulation in debug mode
wpi.cpp.debugSimulation = false

// Default enable simgui
wpi.sim.addGui().defaultEnabled = true
// Enable DS but not by default
wpi.sim.addDriverstation()

model {
    components {
        frcUserProgram(NativeExecutableSpec) {
            targetPlatform wpi.platforms.roborio
            if (includeDesktopSupport) {
                targetPlatform wpi.platforms.desktop
            }

            sources.cpp {
                source {
                    srcDir 'src'
                    include '**/*.cpp', '**/*.cc'
                }
                exportedHeaders {
                    srcDir 'src'
                }
            }

            // Set deploy task to deploy this component
            deployArtifact.component = it

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            // Enable simulation for this component
            wpi.sim.enable(it)
            // Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
    testSuites {
        frcUserProgramTest(GoogleTestTestSuiteSpec) {
            testing $.components.frcUserProgram

            sources.cpp {
                source {
                    srcDir 'test'
                    include '**/*.cpp'
                }
            }

            // Enable run tasks for this component
            wpi.cpp.enableExternalTasks(it)

            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
            wpi.cpp.deps.googleTest(it)
        }
    }
}

// Custom task to extract Lua modules from vendordeps
import groovy.json.JsonSlurper

task extractLuaModules {
    doLast {
        def vendordepsDir = file('vendordeps')
        def luabotDir = file('build/luabot')
        
        // Cache directory similar to Gradle's dependency cache
        def cacheDir = new File(gradle.gradleUserHomeDir, 'caches/luabot-modules')
        cacheDir.mkdirs()

        // Parse all vendordeps JSON files
        vendordepsDir.eachFileMatch(~/.*\.json/) { vendordepFile ->
            def json = new JsonSlurper().parse(vendordepFile)
            
            // Check if this vendordep has luaDependencies
            if (json.luaDependencies) {
                def mavenUrls = json.mavenUrls ?: []
                
                json.luaDependencies.each { dep ->
                    def groupId = dep.groupId
                    def artifactId = dep.artifactId
                    def version = dep.version
                    def classifier = dep.moduleClassifier ?: 'modules'
                    def ffiEnabled = dep.ffiEnabled ?: false

                    def luaDir = ffiEnabled ? new File(luabotDir, 'share/luajit-2.1')
                                            : new File(luabotDir, 'share/lua/5.1')
                    luaDir.mkdirs()

                    // Convert groupId to path (e.g., "org.luabot" -> "org/luabot")
                    def groupPath = groupId.replace('.', '/')
                    
                    // Build artifact path and filename
                    def artifactPath = "${groupPath}/${artifactId}/${version}"
                    def fileName = "${artifactId}-${version}-${classifier}.zip"
                    def fullPath = "${artifactPath}/${fileName}"
                    
                    // println "Resolving Lua dependency: ${groupId}:${artifactId}:${version}:${classifier}"
                    
                    // Check cache directory first (persistent across builds)
                    def cachedZip = new File(cacheDir, "${groupId.replace('.', '-')}-${artifactId}-${version}-${classifier}.zip")
                    
                    def zipToExtract = null
                    
                    if (cachedZip.exists()) {
                        // println "  ✓ Found in cache: ${cachedZip.name}"
                        zipToExtract = cachedZip
                    } else {
                        // Not found in cache, try downloading from Maven URLs
                        def downloadSuccess = false
                        for (mavenUrl in mavenUrls) {
                            try {
                                def url = new URL("${mavenUrl}${fullPath}")
                                
                                // println "  Downloading from: ${url}"
                                
                                url.withInputStream { input ->
                                    cachedZip.withOutputStream { output ->
                                        output << input
                                    }
                                }
                                
                                zipToExtract = cachedZip
                                downloadSuccess = true
                                // println "  ✓ Downloaded and cached: ${cachedZip.name}"
                                break
                                
                            } catch (Exception e) {
                                println "Failed to download from ${mavenUrl}: ${e.message}"
                            }
                        }
                        
                        if (!downloadSuccess) {
                            throw new GradleException("Failed to download Lua dependency: ${groupId}:${artifactId}:${version}:${classifier}")
                        }
                    }
                    
                    // println "  Extracting to: ${luaDir.absolutePath}"
                    
                    // Extract the zip file
                    
                    // Check if luabot/init.lua exists after extraction
                    def initFile = new File(luaDir, "luabot/init.lua")
                    if (!initFile.exists()) {
                        ant.unzip(src: zipToExtract.absolutePath, dest: luaDir.absolutePath, overwrite: true)
                    }
                    
                    // println "  ✓ Successfully extracted"
                }
            }
        }
    }
}

// Run extractLuaModules before build, simulation, and test tasks
tasks.matching { task ->
    task.name == 'build' || 
    task.name.startsWith('simulate') || 
    task.name.startsWith('test')
}.configureEach {
    dependsOn extractLuaModules
}
